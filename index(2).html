<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11111b">
  <meta name="description" content="Biglietto da visita digitale di Andrea Caliumi. Comunicazione, marketing e contenuti digitali.">
  <title>Andrea Caliumi | Digital Card</title>
  <style>
    :root { color-scheme: dark; --bg:#0d0d15; --panel:rgba(255,255,255,.075); --line:rgba(255,255,255,.13); --text:#f8f7ff; --muted:#b9b6c9; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px 16px; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--text); background:
        radial-gradient(ellipse at 12% 8%, rgba(236,72,153,.28), transparent 35%),
        radial-gradient(ellipse at 90% 15%, rgba(124,58,237,.32), transparent 36%),
        radial-gradient(ellipse at 65% 100%, rgba(14,165,233,.18), transparent 40%), var(--bg);
    }
    .card { width:min(100%, 440px); position:relative; overflow:hidden; padding:34px 24px 24px; border:1px solid var(--line); border-radius:30px; background:rgba(20,19,31,.82); box-shadow:0 24px 90px rgba(0,0,0,.38); backdrop-filter:blur(18px); }
    .glow { position:absolute; width:190px; height:190px; border-radius:50%; background:linear-gradient(135deg,#ec4899,#8b5cf6,#38bdf8); filter:blur(70px); opacity:.22; top:-95px; right:-50px; pointer-events:none; }
    .content { position:relative; z-index:1; }
    .avatar { width:112px; height:112px; margin:0 auto 20px; border-radius:50%; display:grid; place-items:center; font-size:34px; font-weight:800; letter-spacing:-2px; color:white; background:linear-gradient(135deg,#f43f9b 0%,#8b5cf6 55%,#38bdf8 100%); border:3px solid rgba(255,255,255,.82); box-shadow:0 8px 30px rgba(139,92,246,.28); }
    .eyebrow { text-align:center; color:#d6c7ff; font-size:11px; font-weight:750; letter-spacing:2.2px; text-transform:uppercase; margin-bottom:9px; }
    h1 { text-align:center; font-size:clamp(29px,7vw,37px); letter-spacing:-1.4px; line-height:1.1; margin:0; }
    .role { text-align:center; color:var(--muted); font-size:14px; line-height:1.6; margin:12px auto 0; max-width:290px; }
    .location { display:flex; justify-content:center; align-items:center; gap:7px; color:#d5d2e2; font-size:13px; margin-top:13px; }
    .rule { height:1px; background:var(--line); margin:27px 0 20px; }
    .links { display:grid; gap:11px; }
    .link { min-height:58px; display:flex; align-items:center; justify-content:center; gap:11px; padding:15px 18px; border-radius:17px; border:1px solid var(--line); text-decoration:none; color:var(--text); font-weight:700; font-size:15px; transition:transform .18s ease, border-color .18s ease; background:var(--panel); }
    .link:hover { transform:translateY(-2px); border-color:rgba(255,255,255,.35); }
    .link.primary { border:0; background:linear-gradient(100deg,#a855f7,#ec4899); box-shadow:0 8px 24px rgba(168,85,247,.18); }
    .link svg { width:20px; height:20px; flex-shrink:0; }
    .foot { text-align:center; color:#89869b; font-size:11px; margin-top:23px; letter-spacing:.3px; }
    @media (max-width:360px) { .card { padding:28px 18px 20px; } .avatar { width:96px; height:96px; } }
    @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="glow" aria-hidden="true"></div>
    <div class="content">
      <!-- Sostituisci le iniziali AC con la tua foto quando vuoi. -->
      <div class="avatar" aria-label="Iniziali Andrea Caliumi">AC</div>
      <div class="eyebrow">Digital business card</div>
      <h1>Andrea Caliumi</h1>
      <p class="role">Comunicazione · Marketing · Contenuti digitali</p>
      <div class="location" style="font-size:12px; margin-top:7px; color:#a9a5bb;">
        Versilia, Toscana
      </div>
      <div class="rule"></div>
      <nav class="links" aria-label="Contatti">
        <a class="link primary" href="https://wa.me/393792169581" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-4.6A8.5 8.5 0 1 1 20.5 11.5Z"/><path d="M8.5 8.2c.4-.7.7-.7 1.1-.7.2 0 .4 0 .6.5l.7 1.6c.1.3.1.5-.1.7l-.5.6c-.2.2-.2.4 0 .7.5.9 1.3 1.6 2.2 2 .3.1.5.1.7-.1l.7-.8c.2-.2.4-.2.7-.1l1.5.7c.3.1.4.3.4.5 0 .4-.2 1-.7 1.3-.5.4-1.2.6-2 .4-1-.2-2.3-.8-3.6-2-1.1-1-1.9-2.3-2.1-3.2-.2-.8.1-1.6.4-2.1Z"/></svg>
          Scrivimi su WhatsApp
        </a>
        <a class="link" href="https://instagram.com/andreakalii_/" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/></svg>
          Seguimi su Instagram
        </a>
      </nav>
    </div>
  </main>
</body>
</html>
